name: Diabeticks
options:
  bundleIdPrefix: com.diabeticks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Diabeticks:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Supabase
    entitlements:
      path: Diabeticks.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Diabeticks
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Diabeticks uses the camera to scan your food and save prescription photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diabeticks.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Set your team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
